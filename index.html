<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dearbebe</title>
    <style>
        /* Makes the entire screen black */
        body { 
            background-color: #000; 
            margin: 0; 
            height: 100vh; 
            width: 100vw; 
            overflow: hidden; 
            cursor: crosshair; 
        }
    </style>
</head>
<body>

    <audio id="vibe" src="boaf.mp3" loop></audio>

    <script>
        const song = document.getElementById('vibe');
        let isPlaying = false;

        // One simple function: if it's not playing, start it.
        function start() {
            if (!isPlaying) {
                song.play();
                isPlaying = true;
            }
        }

        // Click anywhere to trigger the sound
        window.addEventListener('click', start);
    </script>
</body>
</html>
