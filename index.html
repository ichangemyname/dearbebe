<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
            --glow: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow: hidden; 
            line-height: 1.6;
        }

        #heart-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 5s ease;
        }

        #music-picker, #landing, .reveal {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0; left: 0;
            transition: all 2s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            padding: 20px;
        }

        /* Initial Screen */
        #music-picker { opacity: 1; pointer-events: all; z-index: 30; }

        .picker-title {
            letter-spacing: 0.3em;
            text-transform: uppercase;
            font-size: 0.9rem;
            margin-bottom: 40px;
            color: var(--text-dim);
            text-align: center;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .action-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px 40px;
            letter-spacing: 0.4em;
            font-weight: 200;
            cursor: pointer;
            backdrop-filter: blur(15px);
            border-radius: 100px;
            transition: all 1s ease;
            opacity: 0;
            transform: translateY(20px);
        }

        .action-btn.show { opacity: 1; transform: translateY(0); }

        .action-btn:hover {
            border-color: var(--text-main);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .photo-card {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4/5;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transform: scale(0.9) translateY(40px);
            transition: all 2.5s ease;
        }

        .active .photo-card {
            transform: scale(1) translateY(0);
            box-shadow: 0 30px 60px rgba(0,0,0,1), 0 0 40px var(--glow);
        }

        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .caption {
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-dim);
            opacity: 0;
            transition: opacity 2s ease 1s;
            text-align: center;
            max-width: 80%;
        }

        .active .caption { opacity: 1; }

        .final-question {
            font-size: 1.8rem;
            letter-spacing: 0.5em;
            text-align: center;
            animation: pulseGlow 4s infinite ease-in-out;
            margin-bottom: 20px;
        }

        @keyframes pulseGlow {
            0%, 100% { text-shadow: 0 0 10px rgba(255,255,255,0.2); opacity: 0.8; }
            50% { text-shadow: 0 0 30px rgba(255,255,255,0.6); opacity: 1; }
        }

        .final-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            position: relative;
            width: 100%;
            justify-content: center;
        }

        #no-btn {
            position: relative;
            transition: 0.3s ease;
            z-index: 100;
        }

        .active { opacity: 1; pointer-events: all; z-index: 10; }
        .exit { opacity: 0; transform: translateY(-80px) scale(1.1); pointer-events: none; }
    </style>
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <div id="music-picker">
        <p class="picker-title">Which song do you like better?</p>
        <div class="btn-group">
            <button class="action-btn show" onclick="selectMusic('boaf.mp3')">Birds of a Feather - Billie Eilish</button>
            <button class="action-btn show" onclick="selectMusic('flylove.mp3')">Fly Love - Jamie Foxx</button>
        </div>
    </div>

    <div id="landing">
        <button class="action-btn show" onclick="startExperience()">PRESS</button>
    </div>

    <div id="moment1" class="reveal">
        <div class="photo-card"><img src="photo1.jpg"></div>
        <p class="caption">Thank you for being my safe place, my favourite person, and the love of my life.</p>
        <button class="action-btn" onclick="nextMoment(1)">CONTINUE</button>
    </div>

    <div id="moment2" class="reveal">
        <div class="photo-card"><img src="photo2.jpg"></div>
        <p class="caption">Every moment spent by you is a treasure, one I'd spend my life digging for.</p>
        <button class="action-btn" onclick="nextMoment(2)">CONTINUE</button>
    </div>

    <div id="moment3" class="reveal">
        <div class="photo-card"><img src="photo3.jpg"></div>
        <p class="caption">I'm so ready for everything to come our way.</p>
        <button class="action-btn" onclick="nextMoment(3)">CONTINUE</button>
    </div>

    <div id="moment4" class="reveal">
        <h1 class="final-question">BE MINE THIS VALENTINES?</h1>
        <div class="final-buttons">
            <button class="action-btn" id="yes-btn" onclick="celebrate()">YES</button>
            <button class="action-btn" id="no-btn">NO</button>
        </div>
    </div>

    <script>
        let audioCtx;
        let selectedTrack = "";
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function selectMusic(track) {
            selectedTrack = track;
            const picker = document.getElementById('music-picker');
            picker.style.opacity = '0';
            picker.style.pointerEvents = 'none';
            
            setTimeout(() => {
                picker.style.display = 'none';
                document.getElementById('landing').classList.add('active');
            }, 1000);
        }

        function startExperience() {
            const audio = new Audio(selectedTrack);
            audio.loop = true;
            audio.playbackRate = 0.8;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 280;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.6;
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            audio.play();

            const landing = document.getElementById('landing');
            landing.style.opacity = '0';
            landing.style.pointerEvents = 'none';
            
            setTimeout(() => { 
                landing.style.display = 'none'; 
                showMoment(1);
            }, 1000);
        }

        function showMoment(n) {
            const current = document.getElementById(`moment${n}`);
            current.classList.add('active');
            
            if (n === 4) {
                startHearts();
                setTimeout(() => {
                    document.getElementById('yes-btn').classList.add('show');
                    document.getElementById('no-btn').classList.add('show');
                    setupNoButton();
                }, 3000);
            } else {
                setTimeout(() => {
                    const btn = current.querySelector('.action-btn');
                    if(btn) btn.classList.add('show');
                }, 4000);
            }
        }

        function nextMoment(n) {
            const current = document.getElementById(`moment${n}`);
            current.classList.remove('active');
            current.classList.add('exit');
            setTimeout(() => { showMoment(n + 1); }, 1500);
        }

        function setupNoButton() {
            const noBtn = document.getElementById('no-btn');
            const moveButton = () => {
                const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
                const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
                noBtn.style.position = 'fixed';
                noBtn.style.left = `${x}px`;
                noBtn.style.top = `${y}px`;
            };
            noBtn.addEventListener('mouseenter', moveButton);
            noBtn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                moveButton();
            });
        }

        function celebrate() {
            const question = document.querySelector('.final-question');
            question.innerHTML = "I LOVE YOU BEBE ❤️";
            document.getElementById('no-btn').style.display = 'none';
            document.getElementById('yes-btn').style.display = 'none';
        }

        function startHearts() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            canvas.style.opacity = '1';
            for(let i = 0; i < 50; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height + canvas.height,
                    size: Math.random() * 15 + 10,
                    speed: Math.random() * 0.4 + 0.2,
                    opacity: Math.random() * 0.3 + 0.1
                });
            }
            animate();
        }

        function drawHeart(x, y, size, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-size / 2, -size / 2, -size, size / 3, 0, size);
            ctx.bezierCurveTo(size, size / 3, size / 2, -size / 2, 0, 0);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.y -= h.speed;
                if(h.y < -100) h.y = canvas.height + 100;
                drawHeart(h.x, h.y, h.size, h.opacity);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            if(hearts.length > 0) {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            }
        });
    </script>
</body>
</html>
