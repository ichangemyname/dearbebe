<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dearbebe</title>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: crosshair;
            color: white;
            font-family: sans-serif;
        }
        /* Buttons stay hidden until you click to start */
        #content { opacity: 0; transition: opacity 2s; text-align: center; }
        .link-btn {
            display: block;
            margin: 10px;
            padding: 10px 20px;
            border: 1px solid white;
            color: white;
            text-decoration: none;
            width: 200px;
        }
    </style>
</head>
<body>

    <div id="start-msg">CLICK TO ENTER</div>

    <div id="content">
        <a href="#" class="link-btn">LINK 1</a>
        <a href="#" class="link-btn">LINK 2</a>
    </div>

    <script>
        let audioCtx;
        let isRunning = false; // THE LOCK

        async function initWarehouse() {
            if (isRunning) return; // Physically stops a second instance
            isRunning = true;

            // Hide the start message and show content
            document.getElementById('start-msg').style.display = 'none';
            document.getElementById('content').style.opacity = '1';

            // 1. Create the Audio Object purely in Javascript (No HTML tag)
            const audio = new Audio("boaf.mp3");
            audio.loop = true;
            audio.crossOrigin = "anonymous";
            audio.playbackRate = 0.82;

            // 2. Setup Audio Engine
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 250; 

            const volume = audioCtx.createGain();
            volume.gain.value = 0.5;

            // 3. Connect the single path
            source.connect(filter);
            filter.connect(volume);
            volume.connect(audioCtx.destination);

            // 4. Play
            try {
                await audio.play();
                console.log("Warehouse vibe active.");
            } catch (err) {
                console.error("Audio failed:", err);
                isRunning = false; // Reset lock so user can try clicking again
            }
        }

        // Listen for the first click only
        window.addEventListener('click', initWarehouse);
    </script>
</body>
</html>
