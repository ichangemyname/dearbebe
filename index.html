<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
            --glow: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow: hidden; 
            line-height: 1.6;
            perspective: 1000px;
        }

        #heart-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 4s ease;
        }

        #landing, .reveal {
            height: 100vh;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: absolute;
            top: 0; left: 0;
            transition: all 2.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            pointer-events: none;
            padding: 20px;
        }

        /* Ensure landing is visible at start */
        #landing { opacity: 1; pointer-events: all; z-index: 20; }

        .action-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 15px 40px;
            letter-spacing: 0.4em;
            font-weight: 200;
            cursor: pointer;
            backdrop-filter: blur(15px);
            border-radius: 100px;
            transition: all 1s ease;
            margin-top: 30px;
            opacity: 0;
            transform: translateY(20px);
        }

        .action-btn.show {
            opacity: 1;
            transform: translateY(0);
        }

        .action-btn:hover {
            border-color: var(--text-main);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }

        .photo-card {
            width: 100%;
            max-width: 380px;
            aspect-ratio: 4/5;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 40px;
            overflow: hidden;
            margin-bottom: 30px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.8);
            transform: scale(0.9) translateY(40px);
            transition: all 2.5s ease;
        }

        .active .photo-card {
            transform: scale(1) translateY(0);
            box-shadow: 0 30px 60px rgba(0,0,0,1), 0 0 40px var(--glow);
        }

        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
        }

        .caption {
            font-size: 0.85rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-dim);
            text-align: center;
            opacity: 0;
            transition: opacity 2s ease 1s;
        }

        .active .caption { opacity: 1; }

        .final-question {
            font-size: 1.8rem;
            letter-spacing: 0.4em;
            text-shadow: 0 0 20px var(--glow);
            text-align: center;
        }

        /* Navigation Classes */
        .active { opacity: 1; pointer-events: all; z-index: 10; }
        .exit { opacity: 0; transform: translateY(-80px) scale(1.1); pointer-events: none; }

    </style>
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <div id="landing">
        <button class="action-btn show" onclick="startExperience()">PRESS</button>
    </div>

    <div id="moment1" class="reveal">
        <div class="photo-card"><img src="photo1.jpg"></div>
        <p class="caption">The start of us</p>
        <button class="action-btn" onclick="nextMoment(1)">CONTINUE</button>
    </div>

    <div id="moment2" class="reveal">
        <div class="photo-card"><img src="photo2.jpg"></div>
        <p class="caption">My favorite silence</p>
        <button class="action-btn" onclick="nextMoment(2)">CONTINUE</button>
    </div>

    <div id="moment3" class="reveal">
        <div class="photo-card"><img src="photo3.jpg"></div>
        <p class="caption">Everything in between</p>
        <button class="action-btn" onclick="nextMoment(3)">CONTINUE</button>
    </div>

    <div id="moment4" class="reveal">
        <h1 class="final-question">BE MINE?</h1>
    </div>

    <script>
        let audioCtx;
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        function startExperience() {
            // Audio setup
            const audio = new Audio("boaf.mp3");
            audio.loop = true;
            audio.playbackRate = 0.8;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 280;
            const gain = audioCtx.createGain();
            gain.gain.value = 0.6;
            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            audio.play();

            // Clear Landing and Start Visuals
            const landing = document.getElementById('landing');
            landing.classList.remove('active');
            landing.classList.add('exit');
            
            // This prevents the "Press" button from lingering
            setTimeout(() => { landing.style.display = 'none'; }, 2000);

            canvas.style.opacity = '1';
            initHearts();
            animate();

            setTimeout(() => { showMoment(1); }, 1000);
        }

        function showMoment(n) {
            const current = document.getElementById(`moment${n}`);
            current.classList.add('active');
            
            // Slow fade in for the button (4 second delay for maximum emotional impact)
            setTimeout(() => {
                const btn = current.querySelector('.action-btn');
                if(btn) btn.classList.add('show');
            }, 4000);
        }

        function nextMoment(n) {
            const current = document.getElementById(`moment${n}`);
            current.classList.remove('active');
            current.classList.add('exit');
            
            setTimeout(() => {
                showMoment(n + 1);
            }, 1500);
        }

        // --- Slow, Beautiful Hearts ---
        function initHearts() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            for(let i = 0; i < 45; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height + canvas.height,
                    size: Math.random() * 10 + 6,
                    speed: Math.random() * 0.3 + 0.15, // Extremely slow drift
                    opacity: Math.random() * 0.25 + 0.05
                });
            }
        }

        function drawHeart(x, y, size, opacity) {
            ctx.save();
            ctx.translate(x, y);
            ctx.beginPath();
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            // Smoother heart path
            ctx.moveTo(0, size / 4);
            ctx.quadraticCurveTo(0, 0, size / 2, 0);
            ctx.quadraticCurveTo(size, 0, size, size / 2);
            ctx.quadraticCurveTo(size, size * 0.75, size / 2, size);
            ctx.lineTo(0, size * 1.4);
            ctx.lineTo(-size / 2, size);
            ctx.quadraticCurveTo(-size, size * 0.75, -size, size / 2);
            ctx.quadraticCurveTo(-size, 0, -size / 2, 0);
            ctx.quadraticCurveTo(0, 0, 0, size / 4);
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.y -= h.speed;
                if(h.y < -100) h.y = canvas.height + 100;
                drawHeart(h.x, h.y, h.size, h.opacity);
            });
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
