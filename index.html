<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>dearbebe</title>
    <style>
        body { 
            background: #000; 
            margin: 0; 
            height: 100vh; 
            width: 100vw;
            display: flex;
            align-items: center; 
            justify-content: center; 
            cursor: crosshair;
            color: #111; /* Text is almost invisible black */
            font-family: monospace;
        }
    </style>
</head>
<body>

    <div id="status">CLICK TO ENTER</div>

    <script>
        let audioCtx;
        let isStarted = false;

        async function startVibe() {
            if (isStarted) return; // Hard lock to prevent double-play
            isStarted = true;

            document.getElementById('status').style.display = 'none';

            // 1. Create the audio source
            const audio = new Audio("boaf.mp3");
            audio.loop = true;
            audio.playbackRate = 0.82; // Keep it slowed down

            // 2. Initialize the Audio Engine
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);

            // 3. THE MUFFLE (Low Pass Filter)
            // This is the ONLY effect. No echo, no delay.
            const muffle = audioCtx.createBiquadFilter();
            muffle.type = 'lowpass';
            muffle.frequency.value = 250; 

            const volume = audioCtx.createGain();
            volume.gain.value = 0.6;

            // 4. THE ROUTING (Straight line: Source -> Muffle -> Volume -> Speakers)
            source.connect(muffle);
            muffle.connect(volume);
            volume.connect(audioCtx.destination);

            await audio.play();
        }

        window.addEventListener('click', startVibe);
    </script>
</body>
</html>
