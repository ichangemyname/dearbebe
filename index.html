<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You</title>
    <style>
        :root {
            --bg: #000000;
            --card-bg: rgba(255, 255, 255, 0.02);
            --border: rgba(255, 255, 255, 0.05);
            --glow: rgba(255, 255, 255, 0.3);
            --text-main: #ffffff;
            --text-dim: #666666;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            overflow-x: hidden;
            line-height: 1.6;
            perspective: 1000px;
        }

        #heart-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            transition: opacity 4s ease;
        }

        #landing {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            position: relative;
            transition: opacity 1.5s ease;
        }

        .press-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 20px 50px;
            letter-spacing: 0.4em;
            font-weight: 200;
            cursor: pointer;
            backdrop-filter: blur(15px);
            border-radius: 100px;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .press-btn:hover {
            border-color: var(--text-main);
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
            letter-spacing: 0.5em;
        }

        #story {
            display: none;
            opacity: 0;
            flex-direction: column;
            align-items: center;
            padding: 150px 20px 250px 20px;
            z-index: 5;
            position: relative;
            transition: opacity 3s ease;
        }

        .reveal {
            opacity: 0;
            transform: translateY(120px) rotateX(10deg) scale(0.95);
            /* Slower transition for a more cinematic scroll */
            transition: all 3.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            margin-bottom: 350px;
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .reveal.active {
            opacity: 1;
            transform: translateY(0) rotateX(0deg) scale(1);
        }

        .photo-card {
            width: 100%;
            aspect-ratio: 4/5;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 30px;
            overflow: hidden;
            margin-bottom: 40px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 20px rgba(255,255,255,0.03);
            transition: box-shadow 1.5s ease;
        }

        .reveal.active .photo-card {
            box-shadow: 0 30px 60px rgba(0,0,0,1), 0 0 30px var(--glow);
        }

        .photo-card img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.7);
            transition: filter 2.5s ease;
        }

        .reveal.active .photo-card img {
            filter: grayscale(100%) brightness(1);
        }

        .caption {
            font-size: 0.85rem;
            font-weight: 300;
            color: var(--text-dim);
            letter-spacing: 0.3em;
            text-transform: uppercase;
            transition: color 2s ease;
        }

        .reveal.active .caption {
            color: var(--text-main);
        }

        .final-question {
            font-size: 1.5rem;
            font-weight: 200;
            letter-spacing: 0.3em;
            margin-top: 100px;
            text-transform: uppercase;
            text-shadow: 0 0 15px var(--glow);
        }
    </style>
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <div id="landing">
        <button class="press-btn" onclick="startExperience()">PRESS</button>
    </div>

    <div id="story">
        <div class="reveal">
            <div class="photo-card">
                <img src="photo1.jpg" alt="">
            </div>
            <p class="caption">The start of us</p>
        </div>

        <div class="reveal">
            <div class="photo-card">
                <img src="photo2.jpg" alt="">
            </div>
            <p class="caption">My favorite silence</p>
        </div>

        <div class="reveal">
            <div class="photo-card">
                <img src="photo3.jpg" alt="">
            </div>
            <p class="caption">Everything in between</p>
        </div>

        <div class="reveal">
            <h1 class="final-question">Be mine?</h1>
        </div>
    </div>

    <script>
        let audioCtx;
        let isStarted = false;
        const canvas = document.getElementById('heart-canvas');
        const ctx = canvas.getContext('2d');
        let hearts = [];

        async function startExperience() {
            if (isStarted) return;
            isStarted = true;

            const audio = new Audio("boaf.mp3");
            audio.loop = true;
            audio.playbackRate = 0.82;

            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioCtx.createMediaElementSource(audio);
            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.value = 250;

            const gain = audioCtx.createGain();
            gain.gain.value = 0.5;

            source.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            audio.play();

            document.getElementById('landing').style.opacity = '0';
            
            setTimeout(() => {
                document.getElementById('landing').style.display = 'none';
                const story = document.getElementById('story');
                story.style.display = 'flex';
                canvas.style.opacity = '1';
                
                setTimeout(() => {
                    story.style.opacity = '1';
                    initHearts();
                    animate();
                    revealOnScroll();
                }, 100);
            }, 1500);
        }

        function initHearts() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Increased heart count
            for(let i = 0; i < 60; i++) {
                hearts.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height + canvas.height,
                    size: Math.random() * 10 + 5,
                    // Faster speed
                    speed: Math.random() * 2 + 1,
                    opacity: Math.random() * 0.4
                });
            }
        }

        function drawHeart(x, y, size, opacity) {
            ctx.save();
            ctx.beginPath();
            ctx.translate(x, y);
            ctx.fillStyle = `rgba(255, 255, 255, ${opacity})`;
            
            // Adjusted bezier curves to fix "stretched" look
            ctx.moveTo(0, size / 4);
            ctx.bezierCurveTo(0, 0, -size / 2, 0, -size / 2, size / 2);
            ctx.bezierCurveTo(-size / 2, size, 0, size * 1.25, 0, size * 1.5);
            ctx.bezierCurveTo(0, size * 1.25, size / 2, size, size / 2, size / 2);
            ctx.bezierCurveTo(size / 2, 0, 0, 0, 0, size / 4);
            
            ctx.fill();
            ctx.restore();
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            hearts.forEach(h => {
                h.y -= h.speed;
                if(h.y < -100) h.y = canvas.height + 100;
                drawHeart(h.x, h.y, h.size, h.opacity);
            });
            requestAnimationFrame(animate);
        }

        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(el => {
                const rect = el.getBoundingClientRect();
                if (rect.top < window.innerHeight - 50) {
                    el.classList.add('active');
                }
            });
        }

        window.addEventListener('scroll', revealOnScroll);

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
